<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sign In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css" integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/sign-in.css">
</head>
<body>
    <div id="logreg-forms">
        <form class="form-signin">
            <h1 class="h3 mb-3 font-weight-normal" style="text-align: center"> Sign in</h1>

            <input type="email" id="signInEmailInput" class="form-control" placeholder="Email address" required="" autofocus="">
            <input type="current-password" id="signInPasswordInput" class="form-control" placeholder="Password" required="">
            
            <br>
            <button disabled type="button" id="signInButton" class="btn btn-success btn-block"><i class="fas fa-sign-in-alt"></i> Sign in</button>
            <script type="module">
                document.getElementById("signInEmailInput").addEventListener("input", () => {
                    document.getElementById("signInButton").disabled = document.getElementById("signInEmailInput").value.trim() === "" || document.getElementById("signInPasswordInput").value.trim() === "";
                });

				document.getElementById("signInPasswordInput").addEventListener("input", () => {
					document.getElementById("signInButton").disabled = document.getElementById("signInEmailInput").value.trim() === "" || document.getElementById("signInPasswordInput").value.trim() === "";
				});

                import { signInButtonOnClick } from "/js/sign-in.js";
                document.getElementById("signInButton").addEventListener("click", signInButtonOnClick);
            </script>
            <hr>
            <!-- <p>Don't have an account!</p>  -->
            <button class="btn btn-primary btn-block" type="button" id="btn-signup"><i class="fas fa-user-plus"></i> Sign up New Account</button>
        </form>
            
        <form class="form-signup">
            <input type="text" id="signUpNameInput" class="form-control" placeholder="First name" required autofocus="">
            <input type="text" id="signUpEmailInput" class="form-control" placeholder="Email address" required autofocus="">
            <input type="new-password" id="signUpPasswordInput" class="form-control" placeholder="Password" required autofocus="">
            <input type="new-password" id="signUpRepeatPasswordInput" class="form-control" placeholder="Repeat Password" required autofocus="">

            <br>
            <button disabled type="button" id="signUpButton" class="btn btn-primary btn-bloc"><i class="fas fa-user-plus"></i> Sign Up</button>
            <a href="#" id="cancel_signup"><i class="fas fa-angle-left"></i> Back</a>
            <a id="signUpVerifyA" style="visibility: hidden">Click here to verify your email</a>

            <script type="module">
                function signUpAnyInputOnInput() {
                    const name = document.getElementById("signUpNameInput").value.trim();
                    const email = document.getElementById("signUpEmailInput").value.trim();
                    const password = document.getElementById("signUpPasswordInput").value.trim();
                    const repeatPassword = document.getElementById("signUpRepeatPasswordInput").value.trim();

                    document.getElementById("signUpButton").disabled = name === "" || email === "" || password === "" || repeatPassword === "";
                }

				document.getElementById("signUpNameInput").addEventListener("input", signUpAnyInputOnInput);
				document.getElementById("signUpEmailInput").addEventListener("input", signUpAnyInputOnInput);
				document.getElementById("signUpPasswordInput").addEventListener("input", signUpAnyInputOnInput);
                document.getElementById("signUpRepeatPasswordInput").addEventListener("input", signUpAnyInputOnInput);

                import { signUpButtonOnClick } from "/js/sign-in.js";
                document.getElementById("signUpButton").addEventListener("click", signUpButtonOnClick);
            </script>
        </form>

        <br>
            
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</body>
</html>
<script type="text/javascript">
function toggleResetPswd(e){
    e.preventDefault();
    $('#logreg-forms .form-signin').toggle() // display:block or none
    $('#logreg-forms .form-reset').toggle() // display:block or none
}

function toggleSignUp(e){
    e.preventDefault();
    $('#logreg-forms .form-signin').toggle(); // display:block or none
    $('#logreg-forms .form-signup').toggle(); // display:block or none
}

$(()=>{
    // Login Register Form
    $('#logreg-forms #forgot_pswd').click(toggleResetPswd);
    $('#logreg-forms #cancel_reset').click(toggleResetPswd);
    $('#logreg-forms #btn-signup').click(toggleSignUp);
    $('#logreg-forms #cancel_signup').click(toggleSignUp);
})
</script>
</body>
</html>
